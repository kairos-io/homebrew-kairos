name: CI

on:
  pull_request:
    paths:
      - "Formula/**/*.rb"
      - ".github/workflows/ci.yml"

jobs:
  validate-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Run style and audit
        run: |
          brew style Formula/kairos-lab.rb
          brew audit --strict --online kairos-lab
